<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">RxRescue</title>
  <desc id="desc">The routing layer for medication access, from prescription sent to medication in hand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071821"/>
      <stop offset="0.52" stop-color="#083344"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="30" fill="url(#bg)"/>
  <circle cx="1060" cy="-10" r="240" fill="#0e7490" opacity="0.18"/>
  <circle cx="1130" cy="390" r="180" fill="#14b8a6" opacity="0.10"/>

  <g transform="translate(84 88)">
    <rect width="174" height="174" rx="42" fill="#0e7490"/>
    <path d="M38 91h27l13-33 21 70 17-43 11 22h28" fill="none" stroke="url(#pulse)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="87" y="151" text-anchor="middle" fill="#ecfeff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Rx</text>
  </g>

  <g transform="translate(302 94)" fill="#ecfeff" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="70" font-size="72" font-weight="750" letter-spacing="-2">RxRescue</text>
    <text x="2" y="121" font-size="28" fill="#a5f3fc">The routing layer for medication access</text>
    <line x1="2" y1="155" x2="722" y2="155" stroke="#22d3ee" stroke-width="2" opacity="0.35"/>
    <text x="2" y="207" font-size="25" fill="#d6f7fb">Prescription sent</text>
    <path d="M210 198h90" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    <path d="M289 188l14 10-14 10" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="330" y="207" font-size="25" fill="#d6f7fb">barrier routed</text>
    <path d="M502 198h90" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    <path d="M581 188l14 10-14 10" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="622" y="207" font-size="25" fill="#ffffff" font-weight="700">medication in hand</text>
  </g>

  <text x="88" y="379" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="2">CLINICIAN-BUILT · EVIDENCE-GROUNDED · AUDITABLE</text>
</svg>
